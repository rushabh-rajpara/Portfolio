<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var redirect = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace("/Portfolio/?redirect=" + encodeURIComponent(redirect));
      })();
    </script>
  </head>
  <body></body>
</html>
